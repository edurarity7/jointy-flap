<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jointy Flap">
<meta name="theme-color" content="#05060f">
<title>Jointy Flap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one full-bleed canvas, fixed 288-unit-wide world scaled to the phone, ground pinned to the bottom. */
:root{
  --night:#0d1024;
  --ink:#05060f;
  --paper:#f3e6c4;
  --ember:#ff6a1f;
  --siren-red:#ff2d4a;
  --siren-blue:#2d7bff;
  --font-arcade:"Press Start 2P", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--paper);font-family:var(--font-arcade)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);touch-action:none}
#c{display:block;touch-action:none}
#mute{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:rgba(13,16,36,.55);color:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation}
#mute:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#mute svg{width:22px;height:22px}
#probe{position:fixed;top:0;left:0;width:1px;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}
</style>
</head><body>

<div id="stage"><canvas id="c" aria-label="Jointy Flap game. Tap to flap."></canvas></div>
<button id="mute" type="button" aria-label="Mute sound"></button>
<div id="probe"></div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const probe = document.getElementById('probe');
const muteBtn = document.getElementById('mute');
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';

/* ---------- Flappy Bird physics, in original 288-wide units, per 60 Hz tick ---------- */
const W = 288, GROUND = 112;
const GRAV = 0.25;       // px / tick^2
const FLAP = -4.6;       // instant upward velocity on tap
const VMAX = 8;          // terminal fall speed
const SPEED = 2;         // world scroll px / tick
const PW = 52;           // tower width (pipe width)
const GAP = 100;         // vertical opening
const SPACING = 160;     // tower to tower
const BX = 78;           // joint x position
const TICK = 1000 / 60;

let H = 512, GY = H - GROUND, scale = 1, safeTop = 0;
let bg = null;

/* ---------- storage ---------- */
function load(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, String(v)); }catch(e){} }
let best = parseInt(load('jf_best', '0'), 10) || 0;
let muted = load('jf_mute', '0') === '1';

/* ---------- audio (synthesised, unlocked on first tap for iOS) ---------- */
let ac = null, noiseBuf = null, master = null;
function audio(){
  if(!ac){
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      // iOS unlock blip
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1,1,22050); b.connect(ac.destination); b.start(0);
    }catch(e){ ac = null; }
  }
  if(ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type, vol, slide, delay){
  if(!ac || muted) return;
  const t0 = ac.currentTime + (delay||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq, q, delay){
  if(!ac || muted) return;
  const t0 = ac.currentTime + (delay||0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.02);
}
const sfx = {
  flap(){ noise(0.14, 0.35, 1100, 0.8); tone(260, 0.09, 'triangle', 0.05, 420); },
  point(){ tone(988, 0.08, 'square', 0.06); tone(1319, 0.22, 'square', 0.06, null, 0.08); },
  hit(){ noise(0.18, 0.7, 380, 0.7); tone(140, 0.16, 'square', 0.12, 55); },
  die(){ tone(720, 0.45, 'sawtooth', 0.05, 140, 0.25); },
  siren(){ for(let i=0;i<2;i++){ tone(640, 0.32, 'triangle', 0.06, 980, 0.55 + i*0.36); } },
  swoosh(){ noise(0.25, 0.25, 2400, 0.6); }
};

/* ---------- mute button ---------- */
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintMute(){ muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON; muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound'); }
paintMute();
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', e => { e.stopPropagation(); audio(); muted = !muted; save('jf_mute', muted ? '1' : '0'); paintMute(); });

/* ---------- seeded random for the skyline ---------- */
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

/* ---------- sizing ---------- */
function resize(){
  const iw = window.innerWidth, ih = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let cssW, cssH;
  if(ih / iw >= 512 / 288){ cssW = iw; cssH = ih; H = Math.round(W * ih / iw); }
  else { cssH = ih; cssW = Math.round(ih * 288 / 512); H = 512; }
  GY = H - GROUND;
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cv.width / W;
  safeTop = (probe.offsetHeight || 0) * (W / cssW);
  buildBackground();
  if(state === 'ready') bird.y = readyY();
}

function buildBackground(){
  bg = document.createElement('canvas');
  bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d');
  b.setTransform(scale, 0, 0, scale, 0, 0);
  // sky
  const g = b.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, '#070920'); g.addColorStop(0.55, '#1a1648'); g.addColorStop(1, '#3d1f55');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const r = rng(420);
  // stars
  for(let i=0;i<70;i++){
    const x = r()*W, y = r()*GY*0.7, s = r() < 0.15 ? 1.4 : 0.8;
    b.fillStyle = `rgba(255,244,220,${0.3 + r()*0.6})`; b.fillRect(x, y, s, s);
  }
  // moon
  const mx = 222, my = Math.max(safeTop + 70, GY*0.2);
  const mg = b.createRadialGradient(mx, my, 6, mx, my, 60);
  mg.addColorStop(0, 'rgba(255,236,190,.35)'); mg.addColorStop(1, 'rgba(255,236,190,0)');
  b.fillStyle = mg; b.fillRect(mx-60, my-60, 120, 120);
  b.fillStyle = '#ffeec6'; b.beginPath(); b.arc(mx, my, 17, 0, Math.PI*2); b.fill();
  b.fillStyle = '#e9d6a6'; b.beginPath(); b.arc(mx-5, my-4, 3.5, 0, Math.PI*2); b.arc(mx+6, my+5, 2.5, 0, Math.PI*2); b.fill();
  // haze
  const hz = b.createLinearGradient(0, GY-140, 0, GY);
  hz.addColorStop(0, 'rgba(255,90,140,0)'); hz.addColorStop(1, 'rgba(255,90,140,.18)');
  b.fillStyle = hz; b.fillRect(0, GY-140, W, 140);
  // far skyline
  let x = -4;
  while(x < W){
    const w = 18 + r()*26, h = 50 + r()*90;
    b.fillStyle = '#231d4f'; b.fillRect(x, GY - h, w, h);
    x += w - 2;
  }
  // near skyline with windows
  x = -6;
  while(x < W){
    const w = 24 + r()*30, h = 30 + r()*70;
    b.fillStyle = '#120f2e'; b.fillRect(x, GY - h, w, h);
    if(r() < 0.35){ b.fillRect(x + w/2 - 1, GY - h - 10, 2, 10); }
    for(let wy = GY - h + 6; wy < GY - 6; wy += 7){
      for(let wx = x + 4; wx < x + w - 4; wx += 6){
        if(r() < 0.28){ b.fillStyle = r() < 0.8 ? 'rgba(255,205,120,.75)' : 'rgba(140,200,255,.7)'; b.fillRect(wx, wy, 2, 3); }
      }
    }
    x += w;
  }
}

/* ---------- game state ---------- */
let state = 'ready';
let t = 0, overT = 0, score = 0, shownScore = 0, newBest = false;
let groundX = 0, flash = 0, shake = 0, emberBoost = 0;
const bird = { y: 200, vy: 0, rot: 0 };
let pipes = [];
const smoke = [], sparks = [];

function readyY(){ return Math.round(GY * 0.47); }
function reset(){
  state = 'ready'; score = 0; shownScore = 0; overT = 0; newBest = false;
  bird.y = readyY(); bird.vy = 0; bird.rot = 0; pipes = [];
  sfx.swoosh();
}
function newPipe(x){
  const mid = GY / 2 - GAP / 2;
  const lo = Math.max(60, mid - 110), hi = Math.min(GY - 60 - GAP, mid + 110);
  return { x, gt: Math.round(lo + Math.random() * (hi - lo)), scored: false, phase: (Math.random()*20)|0 };
}
function start(){ state = 'play'; pipes = [newPipe(W + 90)]; flap(); }
function flap(){
  bird.vy = FLAP; emberBoost = 1; sfx.flap();
  const e = emberPos();
  for(let i=0;i<5;i++) puff(e.x, e.y, 1.6);
  for(let i=0;i<4;i++) spark(e.x, e.y);
}
function die(onGround){
  flash = 1; shake = 7; sfx.hit();
  if(score > best){ best = score; newBest = true; save('jf_best', best); }
  if(onGround){ state = 'over'; overT = 0; sfx.siren(); }
  else { state = 'dying'; bird.vy = Math.max(bird.vy, 0); sfx.die(); }
}

/* ---------- particles ---------- */
function emberPos(){
  const c = Math.cos(bird.rot), s = Math.sin(bird.rot);
  return { x: BX + 20*c, y: bird.y + 20*s };
}
function puff(x, y, k){
  smoke.push({ x, y, vx: (Math.random()-0.5)*0.6*k - (state==='play'||state==='ready' ? SPEED*0.6 : 0),
    vy: -0.25 - Math.random()*0.45*k, r: 2 + Math.random()*2, life: 0, max: 60 + Math.random()*40 });
}
function spark(x, y){
  sparks.push({ x, y, vx: (Math.random()-0.2)*2.2, vy: -1 - Math.random()*1.8, life: 0, max: 18 + Math.random()*14 });
}

/* ---------- collision ---------- */
// cop tower parts in local space: y = 0 at the gap edge, +y going into the tower
const COP_PARTS = [[-21,3,42,14],[-30,16,60,6],[-19,22,38,18],[-27,38,54,100000]];
function hitCircleRect(cx, cy, r, x, y, w, h){
  const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
  const dx = cx - nx, dy = cy - ny; return dx*dx + dy*dy < r*r;
}
function birdCircles(){
  const c = Math.cos(bird.rot), s = Math.sin(bird.rot);
  return [[BX, bird.y, 7], [BX + 12*c, bird.y + 12*s, 6], [BX - 12*c, bird.y - 12*s, 4]];
}
function hitsPipe(p){
  const cx = p.x + PW/2, gb = p.gt + GAP;
  for(const [bx, by, br] of birdCircles()){
    for(const [lx, ly, w, h] of COP_PARTS){
      if(hitCircleRect(bx, by, br, cx + lx, gb + ly, w, h)) return true;           // bottom tower
      if(hitCircleRect(bx, by, br, cx - lx - w, p.gt - ly - h, w, h)) return true; // top tower (rotated 180)
    }
  }
  return false;
}

/* ---------- update (fixed 60 Hz) ---------- */
function update(){
  t++;
  if(flash > 0) flash = Math.max(0, flash - 0.07);
  if(shake > 0) shake = Math.max(0, shake - 0.6);
  emberBoost *= 0.9;

  if(state === 'ready'){
    bird.y = readyY() + Math.sin(t * 0.12) * 4;
    bird.rot = 0;
    groundX = (groundX + SPEED) % 24;
  } else if(state === 'play'){
    bird.vy = Math.min(bird.vy + GRAV, VMAX);
    bird.y += bird.vy;
    if(bird.vy < 1.6) bird.rot += (-0.44 - bird.rot) * 0.45;
    else bird.rot = Math.min(Math.PI/2, bird.rot + 0.07);
    groundX = (groundX + SPEED) % 24;

    for(const p of pipes){
      p.x -= SPEED;
      if(!p.scored && p.x + PW/2 < BX){ p.scored = true; score++; sfx.point(); }
    }
    while(pipes.length && pipes[0].x < -80) pipes.shift();
    let last = pipes[pipes.length - 1];
    while(last.x < W + 40){ last = newPipe(last.x + SPACING); pipes.push(last); }

    let dead = false;
    for(const p of pipes){ if(p.x < BX + 40 && p.x + PW > BX - 40 && hitsPipe(p)){ dead = true; break; } }
    const lowest = Math.max(...birdCircles().map(c => c[1] + c[2]));
    if(lowest >= GY){ bird.y -= lowest - GY; die(true); }
    else if(dead) die(false);
  } else if(state === 'dying'){
    bird.vy = Math.min(bird.vy + 0.45, 10);
    bird.y += bird.vy;
    bird.rot = Math.min(Math.PI/2, bird.rot + 0.12);
    const lowest = Math.max(...birdCircles().map(c => c[1] + c[2]));
    if(lowest >= GY){ bird.y -= lowest - GY; state = 'over'; overT = 0; shake = 3; sfx.siren(); }
  } else if(state === 'over'){
    overT++;
    if(overT > 30 && shownScore < score && overT % 3 === 0) shownScore++;
    if(overT === 30 && score === 0) shownScore = 0;
  }

  // smoke always rises from the ember
  if(t % 2 === 0){ const e = emberPos(); puff(e.x + 1, e.y - 1, 1); }
  if(Math.random() < 0.04){ const e = emberPos(); spark(e.x, e.y); }
  for(let i = smoke.length - 1; i >= 0; i--){
    const s = smoke[i]; s.life++; s.x += s.vx + Math.sin((s.life + i) * 0.08) * 0.15; s.y += s.vy; s.r += 0.12; s.vy *= 0.995;
    if(s.life > s.max) smoke.splice(i, 1);
  }
  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i]; s.life++; s.x += s.vx - (state === 'play' ? SPEED*0.5 : 0); s.y += s.vy; s.vy += 0.12;
    if(s.life > s.max || s.y > GY) sparks.splice(i, 1);
  }
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function star(x, y, r, fill){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rad = i % 2 ? r*0.45 : r; ctx.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#7a5410'; ctx.stroke();
}
function text(str, x, y, size, fill, sw){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = sw === undefined ? Math.max(3, size * 0.32) : sw; ctx.strokeStyle = '#05060f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

/* ---------- cop tower ---------- */
function drawCop(px, edge, top, phase){
  const L = top ? edge + 60 : GY - edge + 4;
  ctx.save();
  ctx.translate(px + PW/2, edge);
  if(top) ctx.rotate(Math.PI);
  const O = '#05060f';
  const bt = 38;
  // uniform body
  ctx.fillStyle = O; ctx.fillRect(-28, bt, 56, L - bt);
  ctx.fillStyle = '#1d2b53'; ctx.fillRect(-26, bt, 52, L - bt);
  ctx.fillStyle = '#2b3f78'; ctx.fillRect(-23, bt, 6, L - bt);
  ctx.fillStyle = '#131d3b'; ctx.fillRect(15, bt, 9, L - bt);
  // epaulettes
  ctx.fillStyle = '#0f1630'; ctx.fillRect(-26, bt, 14, 4); ctx.fillRect(12, bt, 14, 4);
  // collar + tie
  ctx.fillStyle = '#dfe6f3'; ctx.beginPath(); ctx.moveTo(-9, bt); ctx.lineTo(0, bt + 10); ctx.lineTo(9, bt); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0b1022'; ctx.fillRect(-2, bt + 3, 4, 16);
  // badge
  star(-13, bt + 17, 5.5, '#f2c230');
  // radio
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(9, bt + 10, 8, 12); ctx.fillRect(14, bt + 5, 2, 6);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(10, bt + 12, 2, 2);
  // belt
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(-26, bt + 44, 52, 7);
  ctx.fillStyle = '#f2c230'; ctx.fillRect(-4, bt + 45, 8, 5);
  ctx.fillStyle = '#0b0d14'; ctx.fillRect(-2, bt + 46.5, 4, 2);
  // stacked "POLICE" panels below the belt
  ctx.font = '7px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(let y = bt + 62; y < L; y += 64){
    for(let row = 0; row < 2; row++){
      for(let i = 0; i < 8; i++){
        ctx.fillStyle = (i + row) % 2 ? '#f4d03f' : '#1f5bd8';
        ctx.fillRect(-26 + i*6.5, y + row*5, 6.5, 5);
      }
    }
    ctx.fillStyle = '#e8eefc'; ctx.fillText('POLICE', 0, y + 30);
  }
  // ears + face
  ctx.fillStyle = O; ctx.beginPath(); ctx.arc(-18, 30, 4.5, 0, 6.3); ctx.arc(18, 30, 4.5, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#d9976b'; ctx.beginPath(); ctx.arc(-18, 30, 3, 0, 6.3); ctx.arc(18, 30, 3, 0, 6.3); ctx.fill();
  rr(-18, 19, 36, 22, 6); ctx.fillStyle = O; ctx.fill();
  rr(-16.5, 20, 33, 19.5, 5); ctx.fillStyle = '#e6a87c'; ctx.fill();
  ctx.fillStyle = '#cf8f63'; ctx.fillRect(-16, 35, 32, 4);
  // aviators
  ctx.fillStyle = '#0b0d14';
  rr(-14, 24, 12, 7, 3); ctx.fill(); rr(2, 24, 12, 7, 3); ctx.fill(); ctx.fillRect(-3, 25, 6, 2);
  ctx.fillStyle = 'rgba(160,210,255,.8)'; ctx.fillRect(-12, 25, 3, 1.5); ctx.fillRect(4, 25, 3, 1.5);
  // moustache + mouth
  ctx.fillStyle = '#4a2a18'; rr(-9, 32.5, 18, 3.5, 1.5); ctx.fill();
  ctx.fillRect(-10, 34, 3, 2.5); ctx.fillRect(7, 34, 3, 2.5);
  ctx.fillStyle = '#7b3b2a'; ctx.fillRect(-3, 37, 6, 1.2);
  // hat crown
  rr(-22, 3, 44, 15, 4); ctx.fillStyle = O; ctx.fill();
  rr(-20.5, 4.5, 41, 12, 3); ctx.fillStyle = '#1d2b53'; ctx.fill();
  ctx.fillStyle = '#2b3f78'; ctx.fillRect(-18, 6, 36, 2);
  for(let i = 0; i < 10; i++){ ctx.fillStyle = i % 2 ? '#f2f2f2' : '#0b0d14'; ctx.fillRect(-20.5 + i*4.1, 12.5, 4.1, 4); }
  star(0, 8.7, 3.6, '#f2c230');
  // visor brim
  rr(-30, 16, 60, 6.5, 3); ctx.fillStyle = O; ctx.fill();
  ctx.fillStyle = '#3a4266'; ctx.fillRect(-24, 17.2, 30, 1.2);
  // siren
  const on = Math.floor((t + phase) / 10) % 2 === 0;
  const col = on ? '#ff2d4a' : '#2d7bff';
  ctx.fillStyle = O; rr(-7.5, -3, 15, 8, 3.5); ctx.fill();
  ctx.fillStyle = col; rr(-6, -2, 12, 6.5, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-3, -1, 3, 1.5);
  ctx.globalCompositeOperation = 'lighter';
  const sg = ctx.createRadialGradient(0, 1, 1, 0, 1, 30);
  sg.addColorStop(0, on ? 'rgba(255,45,74,.55)' : 'rgba(45,123,255,.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.fillRect(-30, -29, 60, 60);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ---------- the joint ---------- */
function drawJoint(){
  ctx.save();
  ctx.translate(BX, bird.y);
  ctx.rotate(bird.rot);
  const flick = 0.75 + Math.sin(t * 0.5) * 0.12 + Math.random() * 0.13 + emberBoost * 0.5;
  // ember glow
  ctx.globalCompositeOperation = 'lighter';
  const gr = ctx.createRadialGradient(19, 0, 1, 19, 0, 22 + emberBoost * 10);
  gr.addColorStop(0, `rgba(255,140,40,${0.55 * flick})`); gr.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(-15, -34, 70, 68);
  ctx.globalCompositeOperation = 'source-over';
  // outline silhouette
  ctx.fillStyle = '#05060f';
  ctx.beginPath(); ctx.moveTo(-20.5, -4.5); ctx.lineTo(16.5, -7.3); ctx.lineTo(16.5, 7.3); ctx.lineTo(-20.5, 4.5); ctx.closePath(); ctx.fill();
  // paper cone
  const pg = ctx.createLinearGradient(0, -6, 0, 6);
  pg.addColorStop(0, '#fffaf0'); pg.addColorStop(0.55, '#efe4cc'); pg.addColorStop(1, '#cbbd9e');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.moveTo(-11, -3.4); ctx.lineTo(15, -5.8); ctx.lineTo(15, 5.8); ctx.lineTo(-11, 3.4); ctx.closePath(); ctx.fill();
  // spiral seam
  ctx.strokeStyle = 'rgba(150,130,95,.55)'; ctx.lineWidth = 0.8;
  for(let x = -8; x < 14; x += 5.5){ ctx.beginPath(); ctx.moveTo(x, 3.5 + x*0.09); ctx.lineTo(x + 3, -3.6 - x*0.09); ctx.stroke(); }
  // crutch / filter tip
  ctx.fillStyle = '#d9b27c'; ctx.fillRect(-19, -3.3, 8.5, 6.6);
  ctx.fillStyle = '#b98c52'; ctx.fillRect(-16.5, -3.3, 1, 6.6); ctx.fillRect(-13.5, -3.3, 1, 6.6);
  // ash ring
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(13.5, -6, 3, 12);
  ctx.fillStyle = '#7d7a76'; ctx.fillRect(14.2, -5.4, 1.3, 10.8);
  // ember
  const eg = ctx.createRadialGradient(18, 0, 0.5, 18, 0, 7);
  eg.addColorStop(0, '#fff3b0'); eg.addColorStop(0.35, `rgba(255,${150 + 60*flick|0},40,1)`); eg.addColorStop(1, '#b3200b');
  ctx.fillStyle = '#05060f'; ctx.beginPath(); ctx.ellipse(17.5, 0, 4.6, 7.2, 0, -Math.PI/2, Math.PI/2); ctx.fill();
  ctx.fillStyle = eg; ctx.beginPath(); ctx.ellipse(17, 0, 3.6, 6.1, 0, -Math.PI/2, Math.PI/2); ctx.fill();
  // stoned eye
  ctx.fillStyle = '#05060f'; ctx.beginPath(); ctx.arc(6, -0.4, 3.9, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(6, -0.4, 3, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#05060f'; ctx.beginPath(); ctx.arc(7.2, 0.4, 1.4, 0, 6.3); ctx.fill();
  ctx.fillStyle = state === 'dying' || state === 'over' ? '#e8c9a0' : '#ff7d8a';
  ctx.beginPath(); ctx.arc(6, -0.4, 3.05, Math.PI*1.02, Math.PI*1.98); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#05060f'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(3, -0.5); ctx.lineTo(9, -0.5); ctx.stroke();
  if(state === 'dying' || state === 'over'){ ctx.strokeStyle = '#05060f'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(4, -2.5); ctx.lineTo(8, 1.7); ctx.moveTo(8, -2.5); ctx.lineTo(4, 1.7); ctx.stroke(); }
  ctx.restore();
}

/* ---------- ground (street) ---------- */
function drawGround(){
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, GY, W, 2);
  // sidewalk curb with scrolling hatch
  ctx.fillStyle = '#8f8aa3'; ctx.fillRect(0, GY + 2, W, 14);
  ctx.save(); ctx.beginPath(); ctx.rect(0, GY + 2, W, 14); ctx.clip();
  ctx.fillStyle = '#a9a4bd';
  for(let x = -groundX - 24; x < W + 24; x += 12){ ctx.beginPath(); ctx.moveTo(x, GY + 16); ctx.lineTo(x + 6, GY + 16); ctx.lineTo(x + 14, GY + 2); ctx.lineTo(x + 8, GY + 2); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#5a556e'; ctx.fillRect(0, GY + 16, W, 3);
  // asphalt
  ctx.fillStyle = '#25223a'; ctx.fillRect(0, GY + 19, W, H - GY - 19);
  ctx.fillStyle = '#f4d03f';
  const ly = GY + 52;
  for(let x = -groundX * 2 % 48 - 48; x < W + 48; x += 48) ctx.fillRect(x, ly, 26, 4);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for(let x = -groundX - 24; x < W + 24; x += 24) ctx.fillRect(x + 7, GY + 30, 2, 2), ctx.fillRect(x + 17, GY + 78, 2, 2);
}

/* ---------- medal ---------- */
function medalFor(s){
  if(s >= 40) return ['#e8f6fb', '#9fc4d0', 'PLAT'];
  if(s >= 30) return ['#f7cf3d', '#b08613', 'GOLD'];
  if(s >= 20) return ['#d5dae2', '#8b93a1', 'SILVER'];
  if(s >= 10) return ['#d58a48', '#8a4f1f', 'BRONZE'];
  return null;
}
function drawMedal(x, y, m){
  if(!m){
    ctx.fillStyle = '#d9c99e'; ctx.beginPath(); ctx.arc(x, y, 20, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#b7a57a'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = '#05060f'; ctx.beginPath(); ctx.arc(x, y, 21.5, 0, 6.3); ctx.fill();
  ctx.fillStyle = m[1]; ctx.beginPath(); ctx.arc(x, y, 20, 0, 6.3); ctx.fill();
  ctx.fillStyle = m[0]; ctx.beginPath(); ctx.arc(x, y, 16.5, 0, 6.3); ctx.fill();
  // seven-point leaf
  ctx.save(); ctx.translate(x, y + 3); ctx.fillStyle = m[1];
  const leaves = [[-1.57, 13], [-2.2, 10], [-0.94, 10], [-2.8, 7], [-0.34, 7], [2.6, 5], [0.54, 5]];
  for(const [a, len] of leaves){
    ctx.save(); ctx.rotate(a + Math.PI/2); ctx.beginPath(); ctx.ellipse(0, -len/2, 1.9, len/2, 0, 0, 6.3); ctx.fill(); ctx.restore();
  }
  ctx.fillRect(-0.7, 0, 1.4, 6);
  ctx.restore();
  // shine
  if(t % 90 < 16){ const k = t % 90; ctx.fillStyle = 'rgba(255,255,255,.9)'; star(x - 10 + k, y - 9 + (k % 5), 2.4, '#fff'); }
}

/* ---------- render ---------- */
function render(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.restore();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // siren wash over the sky
  const busted = state === 'over' || state === 'dying';
  const ph = Math.floor(t / (busted ? 8 : 14)) % 2;
  const wa = busted ? 0.22 : 0.07;
  const wg = ctx.createRadialGradient(ph ? 0 : W, GY, 10, ph ? 0 : W, GY, H * 0.9);
  wg.addColorStop(0, ph ? `rgba(255,45,74,${wa})` : `rgba(45,123,255,${wa})`); wg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

  for(const p of pipes){ drawCop(p.x, p.gt, true, p.phase); drawCop(p.x, p.gt + GAP, false, p.phase + 10); }

  for(const s of smoke){
    const a = (1 - s.life / s.max) * 0.38;
    ctx.fillStyle = `rgba(210,214,230,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill();
  }

  drawGround();
  drawJoint();

  ctx.globalCompositeOperation = 'lighter';
  for(const s of sparks){ const a = 1 - s.life / s.max; ctx.fillStyle = `rgba(255,${160 + (a*80|0)},60,${a})`; ctx.fillRect(s.x - 0.8, s.y - 0.8, 1.6, 1.6); }
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
  drawUI();

  if(flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

function drawUI(){
  const top = safeTop + 8;
  if(state === 'play' || state === 'dying'){
    text(String(score), W/2, top + 44, 26, '#fff', 6);
  }
  if(state === 'ready'){
    text('JOINTY', W/2, top + 62, 26, '#ff8a2a', 7);
    text('FLAP', W/2, top + 96, 26, '#7ee06a', 7);
    text('GET READY', W/2, bird.y - 70, 14, '#ffe9a8', 5);
    // tap hint
    const k = (t % 60) / 60;
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(BX, bird.y + 52, 10 + k * 14, 0, 6.3); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(BX, bird.y + 52, 7, 0, 6.3); ctx.fill();
    text('TAP', BX + 50, bird.y + 52, 10, '#fff', 4);
    if(best > 0) text('BEST ' + best, W/2, GY + 86, 10, '#cfc9e6', 4);
  }
  if(state === 'over'){
    const e = Math.min(1, overT / 22), ease = 1 - Math.pow(1 - e, 3);
    const tY = Math.max(top + 70, GY * 0.26);
    if(overT > 4){
      const bc = Math.floor(t / 8) % 2 ? '#ff2d4a' : '#5b9bff';
      text('BUSTED!', W/2, tY - (1 - Math.min(1, (overT - 4) / 10)) * 20, 28, bc, 7);
    }
    const pw = 236, ph = 124, px = (W - pw) / 2;
    const py = Math.max(tY + 34, GY * 0.42) + (1 - ease) * H;
    rr(px - 3, py - 3, pw + 6, ph + 6, 12); ctx.fillStyle = '#05060f'; ctx.fill();
    rr(px, py, pw, ph, 10); ctx.fillStyle = '#f3e6c4'; ctx.fill();
    rr(px + 6, py + 6, pw - 12, ph - 12, 7); ctx.strokeStyle = '#c9b582'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '8px ' + FONT; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#b5532a'; ctx.textAlign = 'center'; ctx.fillText('MEDAL', px + 56, py + 24);
    ctx.textAlign = 'right'; ctx.fillText('SCORE', px + pw - 18, py + 24); ctx.fillText('BEST', px + pw - 18, py + 70);
    drawMedal(px + 56, py + 66, overT > 34 ? medalFor(score) : null);
    ctx.font = '16px ' + FONT; ctx.textAlign = 'right'; ctx.lineWidth = 4; ctx.strokeStyle = '#05060f'; ctx.fillStyle = '#fff';
    ctx.strokeText(String(shownScore), px + pw - 18, py + 46); ctx.fillText(String(shownScore), px + pw - 18, py + 46);
    ctx.strokeText(String(best), px + pw - 18, py + 92); ctx.fillText(String(best), px + pw - 18, py + 92);
    if(newBest && shownScore >= score && overT > 40){
      rr(px + pw - 120, py + 63, 34, 14, 3); ctx.fillStyle = '#ff2d4a'; ctx.fill();
      ctx.font = '7px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('NEW', px + pw - 103, py + 70.5);
    }
    if(overT > 45 && Math.floor(t / 24) % 2 === 0) text('TAP TO ROLL AGAIN', W/2, py + ph + 30, 10, '#fff', 4);
  }
}

/* ---------- input ---------- */
function press(e){
  if(e && e.cancelable) e.preventDefault();
  audio();
  if(state === 'ready') start();
  else if(state === 'play') flap();
  else if(state === 'over' && overT > 45) reset();
}
stage.addEventListener('pointerdown', press, { passive: false });
stage.addEventListener('touchstart', e => { if(e.cancelable) e.preventDefault(); }, { passive: false });
// iOS Safari only unlocks Web Audio on touchend/click, not on pointerdown
stage.addEventListener('touchend', () => audio(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter'){ e.preventDefault(); if(!e.repeat) press(); }
});

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(now - last, 250); last = now;
  while(acc >= TICK){ update(); acc -= TICK; }
  render();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
window.addEventListener('resize', resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

resize();
bird.y = readyY();
if(document.fonts && document.fonts.load){ document.fonts.load('16px "Press Start 2P"').catch(() => {}); }
requestAnimationFrame(loop);
})();
</script>
</body></html>
